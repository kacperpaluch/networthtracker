services:
  networthtracker:
    image: kpa90/networthtracker:latest
    container_name: networthtracker
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:8000"
    environment:
      DATABASE_URL: sqlite:////data/networth.db
      LOAD_DEMO_DATA: "${LOAD_DEMO_DATA:-false}"
      BACKUP_CRON: "${BACKUP_CRON:-0 3 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      RUN_BACKUP_ON_START: "${RUN_BACKUP_ON_START:-true}"
      TZ: "${TZ:-Europe/Warsaw}"
    volumes:
      - networthtracker_v2_data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  networthtracker_v2_data:
